<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6T9 Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#0f0f1a;color:#fff;font-family:Arial,sans-serif;text-align:center;overflow:hidden;user-select:none}
  .top{padding:15px;display:flex;justify-content:space-between;align-items:center}
  .top b{font-size:14px}
  .balance{margin-top:20px}
  .balance span{font-size:14px;color:#aaa}
  .balance h1{font-size:48px;margin:5px 0}
  .balance h1 small{font-size:28px;color:#FFD700}
  .coin-circle{width:230px;height:230px;margin:25px auto;background:radial-gradient(circle at 30% 30%, #FFE55C, #FFB800 60%, #E69A00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:0 0 60px rgba(255,184,0,.5), inset 0 -15px 30px rgba(0,0,0,.2);cursor:pointer;transition:transform .08s}
  .coin-circle:active{transform:scale(.92)}
  .energy{width:85%;margin:20px auto;text-align:left}
  .energy-bar{height:12px;background:#333;border-radius:10px;overflow:hidden;margin-top:6px}
  .energy-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8A00);width:100%;transition:width .3s}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:20px;padding:0 15px}
  .btns button{flex:1;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:bold;cursor:pointer}
  .btn-community{background:#222;color:#fff}
  .btn-lang{background:#222;color:#fff}
  .claim{width:85%;margin:15px auto;padding:16px;background:#FFD700;border:none;border-radius:16px;font-size:18px;font-weight:bold;cursor:pointer}
  .float{position:absolute;font-size:28px;font-weight:bold;color:#FFD700;animation:up 0.8s ease-out forwards;pointer-events:none;z-index:10}
  @keyframes up{to{transform:translateY(-100px);opacity:0}}
</style>
</head>
<body>
  <div class="top"><b>👤 <span id="username">Guest</span></b><b>6T9 MINING ⛏️</b></div>

  <div class="balance">
    <span>💰 YOUR BALANCE</span>
    <h1><span id="bal">0</span> <small>6T9</small></h1>
    <span>1 Tap = 1 Coin</span>
  </div>

  <div class="coin-circle" id="tapBtn">🪙</div>

  <div class="energy">
    <b>⚡ Energy: <span id="energyText">1000</span> / 1000</b>
    <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  </div>

  <button class="claim" onclick="claimBonus()">🎁 Claim Daily Bonus +100</button>

  <div class="btns">
    <button class="btn-community" onclick="openCommunity()">🌐 Community</button>
    <button class="btn-lang" onclick="changeLang()">🌍 Language</button>
  </div>

<script>
  let tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  let balance = parseInt(localStorage.getItem('6t9_bal') || 0);
  let energy = parseInt(localStorage.getItem('6t9_energy') || 1000);
  let lastTime = parseInt(localStorage.getItem('6t9_time') || Date.now());
  // Energy refill - 1 per 2 sec
  let refill = Math.floor((Date.now() - lastTime) / 2000);
  energy = Math.min(1000, energy + refill);

  let user = tg.initDataUnsafe?.user;
  if(user) document.getElementById('username').innerText = user.first_name;

  function update(){
    document.getElementById('bal').innerText = balance.toLocaleString();
    document.getElementById('energyText').innerText = energy;
    document.getElementById('energyFill').style.width = (energy/10) + '%';
    localStorage.setItem('6t9_bal', balance);
    localStorage.setItem('6t9_energy', energy);
    localStorage.setItem('6t9_time', Date.now());
  }
  update();

  document.getElementById('tapBtn').addEventListener('touchstart', function(e){
    e.preventDefault();
    tap(e.touches[0].clientX, e.touches[0].clientY);
  });
  document.getElementById('tapBtn').addEventListener('click', function(e){
    tap(e.clientX, e.clientY);
  });

  function tap(x,y){
    if(energy <= 0){ tg.showAlert('Energy ses! Ektu wait koro ⚡'); return; }
    balance += 1;
    energy -= 1;
    if(navigator.vibrate) navigator.vibrate(10);
    let f = document.createElement('div');
    f.className='float'; f.innerText='+1';
    f.style.left = x+'px'; f.style.top = y+'px';
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 800);
    update();
  }

  function claimBonus(){
    balance += 100;
    tg.showAlert('Daily Bonus +100 Coin peye geso! 🎉');
    update();
  }
  function openCommunity(){
    tg.openTelegramLink('https://t.me/6T9bot');
  }
  function changeLang(){
    tg.showAlert('Language: English / Bangla - Coming Soon!');
  }
  // Auto energy refill
  setInterval(()=>{ if(energy<1000){ energy++; update(); } }, 2000);
</script>
</body>
</html>
